openapi: 3.2.0
info:
  contact:
    email: info@portainer.io
  description: Portainer API is an HTTP API served by Portainer.
  license:
    name: zlib
    url: https://github.com/portainer/portainer/blob/develop/LICENSE
  title: PortainerCE Stacks API
  version: 2.39.1
servers:
- url: /api
tags:
- description: Manage stacks
  name: Stacks
paths:
  /stacks:
    get:
      description: 'List all stacks based on the current user authorizations.

        Will return all stacks if using an administrator account otherwise it

        will only return the list of stacks the user have access to.

        Limited stacks will not be returned by this endpoint.

        **Access policy**: authenticated'
      operationId: StackList
      parameters:
      - description: 'Filters to process on the stack list. Encoded as JSON (a map[string]string). For example, {''SwarmID'': ''jpofkc0i9uo9wtx1zesuk649w''} will only return stacks that are part of the specified Swarm cluster. Available filters: EndpointID, SwarmID.'
        in: query
        name: filters
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/portainer.Stack'
                type: array
        '204':
          description: Success
        '400':
          description: Invalid request
        '500':
          description: Server error
      security:
      - ApiKeyAuth: []
      - jwt: []
      summary: List stacks
      tags:
      - Stacks
  /stacks/{id}:
    delete:
      description: 'Remove a stack.

        **Access policy**: restricted'
      operationId: StackDelete
      parameters:
      - description: Stack identifier
        in: path
        name: id
        required: true
        schema:
          type: integer
      - description: Set to true to delete an external stack. Only external Swarm stacks are supported
        in: query
        name: external
        schema:
          type: boolean
      - description: Environment identifier
        in: query
        name: endpointId
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: Success
        '400':
          description: Invalid request
        '403':
          description: Permission denied
        '404':
          description: Not found
        '500':
          description: Server error
      security:
      - ApiKeyAuth: []
      - jwt: []
      summary: Remove a stack
      tags:
      - Stacks
    get:
      description: 'Retrieve details about a stack.

        **Access policy**: restricted'
      operationId: StackInspect
      parameters:
      - description: Stack identifier
        in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/portainer.Stack'
        '400':
          description: Invalid request
        '403':
          description: Permission denied
        '404':
          description: Stack not found
        '500':
          description: Server error
      security:
      - ApiKeyAuth: []
      - jwt: []
      summary: Inspect a stack
      tags:
      - Stacks
    put:
      description: 'Update a stack, only for file based stacks.

        **Access policy**: authenticated'
      operationId: StackUpdate
      parameters:
      - description: Stack identifier
        in: path
        name: id
        required: true
        schema:
          type: integer
      - description: Environment identifier
        in: query
        name: endpointId
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/portainer.Stack'
        '400':
          description: Invalid request
        '403':
          description: Permission denied
        '404':
          description: Not found
        '500':
          description: Server error
      security:
      - ApiKeyAuth: []
      - jwt: []
      summary: Update a stack
      tags:
      - Stacks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/stacks.updateSwarmStackPayload'
        description: Stack details
        required: true
  /stacks/{id}/associate:
    put:
      description: '**Access policy**: administrator'
      operationId: StackAssociate
      parameters:
      - description: Stack identifier
        in: path
        name: id
        required: true
        schema:
          type: integer
      - description: Environment identifier
        in: query
        name: endpointId
        required: true
        schema:
          type: integer
      - description: Swarm identifier
        in: query
        name: swarmId
        required: true
        schema:
          type: integer
      - description: Indicates whether the stack is orphaned
        in: query
        name: orphanedRunning
        required: true
        schema:
          type: boolean
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/portainer.Stack'
        '400':
          description: Invalid request
        '403':
          description: Permission denied
        '404':
          description: Stack not found
        '500':
          description: Server error
      security:
      - ApiKeyAuth: []
      - jwt: []
      summary: Associate an orphaned stack to a new environment(endpoint)
      tags:
      - Stacks
  /stacks/{id}/file:
    get:
      description: 'Get Stack file content.

        **Access policy**: restricted'
      operationId: StackFileInspect
      parameters:
      - description: Stack identifier
        in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/stacks.stackFileResponse'
        '400':
          description: Invalid request
        '403':
          description: Permission denied
        '404':
          description: Stack not found
        '500':
          description: Server error
      security:
      - ApiKeyAuth: []
      - jwt: []
      summary: Retrieve the content of the Stack file for the specified stack
      tags:
      - Stacks
  /stacks/{id}/git:
    post:
      description: 'Update the Git settings in a stack, e.g., RepositoryReferenceName and AutoUpdate

        **Access policy**: authenticated'
      operationId: StackUpdateGit
      parameters:
      - description: Stack identifier
        in: path
        name: id
        required: true
        schema:
          type: integer
      - description: Stacks created before version 1.18.0 might not have an associated environment(endpoint) identifier. Use this optional parameter to set the environment(endpoint) identifier used by the stack.
        in: query
        name: endpointId
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/portainer.Stack'
        '400':
          description: Invalid request
        '403':
          description: Permission denied
        '404':
          description: Not found
        '500':
          description: Server error
      security:
      - ApiKeyAuth: []
      - jwt: []
      summary: Update a stack's Git configs
      tags:
      - Stacks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/stacks.stackGitUpdatePayload'
        description: Git configs for pull and redeploy a stack
        required: true
  /stacks/{id}/git/redeploy:
    put:
      description: 'Pull and redeploy a stack via Git

        **Access policy**: authenticated'
      operationId: StackGitRedeploy
      parameters:
      - description: Stack identifier
        in: path
        name: id
        required: true
        schema:
          type: integer
      - description: Stacks created before version 1.18.0 might not have an associated environment(endpoint) identifier. Use this optional parameter to set the environment(endpoint) identifier used by the stack.
        in: query
        name: endpointId
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/portainer.Stack'
        '400':
          description: Invalid request
        '403':
          description: Permission denied
        '404':
          description: Not found
        '500':
          description: Server error
      security:
      - ApiKeyAuth: []
      - jwt: []
      summary: Redeploy a stack
      tags:
      - Stacks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/stacks.stackGitRedployPayload'
        description: Git configs for pull and redeploy of a stack. **StackName** may only be populated for Kuberenetes stacks, and if specified with a blank string, it will be set to blank
        required: true
  /stacks/{id}/migrate:
    post:
      description: 'Migrate a stack from an environment(endpoint) to another environment(endpoint). It will re-create the stack inside the target environment(endpoint) before removing the original stack.

        **Access policy**: authenticated'
      operationId: StackMigrate
      parameters:
      - description: Stack identifier
        in: path
        name: id
        required: true
        schema:
          type: integer
      - description: Stacks created before version 1.18.0 might not have an associated environment(endpoint) identifier. Use this optional parameter to set the environment(endpoint) identifier used by the stack.
        in: query
        name: endpointId
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/portainer.Stack'
        '400':
          description: Invalid request
        '403':
          description: Permission denied
        '404':
          description: Stack not found
        '409':
          description: A stack with the same name is already running on the target environment(endpoint)
        '500':
          description: Server error
      security:
      - ApiKeyAuth: []
      - jwt: []
      summary: Migrate a stack to another environment(endpoint)
      tags:
      - Stacks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/stacks.stackMigratePayload'
        description: Stack migration details
        required: true
  /stacks/{id}/start:
    post:
      description: 'Starts a stopped Stack.

        **Access policy**: authenticated'
      operationId: StackStart
      parameters:
      - description: Stack identifier
        in: path
        name: id
        required: true
        schema:
          type: integer
      - description: Environment identifier
        in: query
        name: endpointId
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/portainer.Stack'
        '400':
          description: Invalid request
        '403':
          description: Permission denied
        '404':
          description: Not found
        '409':
          description: Stack name is not unique
        '500':
          description: Server error
      security:
      - ApiKeyAuth: []
      - jwt: []
      summary: Starts a stopped Stack
      tags:
      - Stacks
  /stacks/{id}/stop:
    post:
      description: 'Stops a stopped Stack.

        **Access policy**: authenticated'
      operationId: StackStop
      parameters:
      - description: Stack identifier
        in: path
        name: id
        required: true
        schema:
          type: integer
      - description: Environment identifier
        in: query
        name: endpointId
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/portainer.Stack'
        '400':
          description: Invalid request
        '403':
          description: Permission denied
        '404':
          description: Not found
        '500':
          description: Server error
      security:
      - ApiKeyAuth: []
      - jwt: []
      summary: Stops a stopped Stack
      tags:
      - Stacks
  /stacks/create/kubernetes/repository:
    post:
      description: 'Deploy a new stack into a Docker environment specified via the environment identifier.

        **Access policy**: authenticated'
      operationId: StackCreateKubernetesGit
      parameters:
      - description: Identifier of the environment that will be used to deploy the stack
        in: query
        name: endpointId
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/portainer.Stack'
        '400':
          description: Invalid request
        '409':
          description: Stack name or webhook ID already exists
        '500':
          description: Server error
      security:
      - ApiKeyAuth: []
      - jwt: []
      summary: Deploy a new kubernetes stack from a git repository
      tags:
      - Stacks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/stacks.kubernetesGitDeploymentPayload'
        description: stack config
        required: true
  /stacks/create/kubernetes/string:
    post:
      description: 'Deploy a new stack into a Docker environment specified via the environment identifier.

        **Access policy**: authenticated'
      operationId: StackCreateKubernetesFile
      parameters:
      - description: Identifier of the environment that will be used to deploy the stack
        in: query
        name: endpointId
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/portainer.Stack'
        '400':
          description: Invalid request
        '500':
          description: Server error
      security:
      - ApiKeyAuth: []
      - jwt: []
      summary: Deploy a new kubernetes stack from a file
      tags:
      - Stacks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/stacks.kubernetesStringDeploymentPayload'
        description: stack config
        required: true
  /stacks/create/kubernetes/url:
    post:
      description: 'Deploy a new stack into a Docker environment specified via the environment identifier.

        **Access policy**: authenticated'
      operationId: StackCreateKubernetesUrl
      parameters:
      - description: Identifier of the environment that will be used to deploy the stack
        in: query
        name: endpointId
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/portainer.Stack'
        '400':
          description: Invalid request
        '500':
          description: Server error
      security:
      - ApiKeyAuth: []
      - jwt: []
      summary: Deploy a new kubernetes stack from a url
      tags:
      - Stacks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/stacks.kubernetesManifestURLDeploymentPayload'
        description: stack config
        required: true
  /stacks/create/standalone/file:
    post:
      description: 'Deploy a new stack into a Docker environment specified via the environment identifier.

        **Access policy**: authenticated'
      operationId: StackCreateDockerStandaloneFile
      parameters:
      - description: Identifier of the environment that will be used to deploy the stack
        in: query
        name: endpointId
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/portainer.Stack'
        '400':
          description: Invalid request
        '500':
          description: Server error
      security:
      - ApiKeyAuth: []
      - jwt: []
      summary: Deploy a new compose stack from a file
      tags:
      - Stacks
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                Name:
                  type: string
                  description: Name of the stack
                Env:
                  type: string
                  description: 'Environment variables passed during deployment, represented as a JSON array [{''name'': ''name'', ''value'': ''value''}].'
                file:
                  type: string
                  description: Stack file
                  format: binary
              required:
              - Name
  /stacks/create/standalone/repository:
    post:
      description: 'Deploy a new stack into a Docker environment specified via the environment identifier.

        **Access policy**: authenticated'
      operationId: StackCreateDockerStandaloneRepository
      parameters:
      - description: Identifier of the environment that will be used to deploy the stack
        in: query
        name: endpointId
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/portainer.Stack'
        '400':
          description: Invalid request
        '409':
          description: Stack name or webhook ID already exists
        '500':
          description: Server error
      security:
      - ApiKeyAuth: []
      - jwt: []
      summary: Deploy a new compose stack from repository
      tags:
      - Stacks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/stacks.composeStackFromGitRepositoryPayload'
        description: stack config
        required: true
  /stacks/create/standalone/string:
    post:
      description: 'Deploy a new stack into a Docker environment specified via the environment identifier.

        **Access policy**: authenticated'
      operationId: StackCreateDockerStandaloneString
      parameters:
      - description: Identifier of the environment that will be used to deploy the stack
        in: query
        name: endpointId
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/portainer.Stack'
        '400':
          description: Invalid request
        '500':
          description: Server error
      security:
      - ApiKeyAuth: []
      - jwt: []
      summary: Deploy a new compose stack from a text
      tags:
      - Stacks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/stacks.composeStackFromFileContentPayload'
        description: stack config
        required: true
  /stacks/create/swarm/file:
    post:
      description: 'Deploy a new stack into a Docker environment specified via the environment identifier.

        **Access policy**: authenticated'
      operationId: StackCreateDockerSwarmFile
      parameters:
      - description: Identifier of the environment that will be used to deploy the stack
        in: query
        name: endpointId
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/portainer.Stack'
        '400':
          description: Invalid request
        '500':
          description: Server error
      security:
      - ApiKeyAuth: []
      - jwt: []
      summary: Deploy a new swarm stack from a file
      tags:
      - Stacks
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                Name:
                  type: string
                  description: Name of the stack
                SwarmID:
                  type: string
                  description: Swarm cluster identifier.
                Env:
                  type: string
                  description: 'Environment variables passed during deployment, represented as a JSON array [{''name'': ''name'', ''value'': ''value''}]. Optional'
                file:
                  type: string
                  description: Stack file
                  format: binary
  /stacks/create/swarm/repository:
    post:
      description: 'Deploy a new stack into a Docker environment specified via the environment identifier.

        **Access policy**: authenticated'
      operationId: StackCreateDockerSwarmRepository
      parameters:
      - description: Identifier of the environment that will be used to deploy the stack
        in: query
        name: endpointId
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/portainer.Stack'
        '400':
          description: Invalid request
        '409':
          description: Stack name or webhook ID already exists
        '500':
          description: Server error
      security:
      - ApiKeyAuth: []
      - jwt: []
      summary: Deploy a new swarm stack from a git repository
      tags:
      - Stacks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/stacks.swarmStackFromGitRepositoryPayload'
        description: stack config
        required: true
  /stacks/create/swarm/string:
    post:
      description: 'Deploy a new stack into a Docker environment specified via the environment identifier.

        **Access policy**: authenticated'
      operationId: StackCreateDockerSwarmString
      parameters:
      - description: Identifier of the environment that will be used to deploy the stack
        in: query
        name: endpointId
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/portainer.Stack'
        '400':
          description: Invalid request
        '500':
          description: Server error
      security:
      - ApiKeyAuth: []
      - jwt: []
      summary: Deploy a new swarm stack from a text
      tags:
      - Stacks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/stacks.swarmStackFromFileContentPayload'
        description: stack config
        required: true
  /stacks/name/{name}:
    delete:
      description: 'Remove a stack.

        **Access policy**: restricted'
      operationId: StackDeleteKubernetesByName
      parameters:
      - description: Stack name
        in: path
        name: name
        required: true
        schema:
          type: string
      - description: Set to true to delete an external stack. Only external Swarm stacks are supported
        in: query
        name: external
        schema:
          type: boolean
      - description: Environment identifier
        in: query
        name: endpointId
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: Success
        '400':
          description: Invalid request
        '403':
          description: Permission denied
        '404':
          description: Not found
        '500':
          description: Server error
      security:
      - ApiKeyAuth: []
      - jwt: []
      summary: Remove Kubernetes stacks by name
      tags:
      - Stacks
  /stacks/webhooks/{webhookID}:
    post:
      description: '**Access policy**: public'
      operationId: WebhookInvoke
      parameters:
      - description: Stack identifier
        in: path
        name: webhookID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
        '400':
          description: Invalid request
        '409':
          description: Autoupdate for the stack isn't available
        '500':
          description: Server error
      summary: Webhook for triggering stack updates from git
      tags:
      - Stacks
components:
  schemas:
    portainer.ResourceAccessLevel:
      enum:
      - 0
      - 1
      type: integer
      x-enum-varnames:
      - _
      - ReadWriteAccessLevel
    portainer.Stack:
      properties:
        AdditionalFiles:
          description: Only applies when deploying stack with multiple files
          items:
            type: string
          type: array
        AutoUpdate:
          allOf:
          - $ref: '#/components/schemas/portainer.AutoUpdateSettings'
          description: The GitOps update settings of a git stack
        CreatedBy:
          description: The username which created this stack
          example: admin
          type: string
        CreationDate:
          description: The date in unix time when stack was created
          example: 1587399600
          type: integer
        EndpointId:
          description: Environment(Endpoint) identifier. Reference the environment(endpoint) that will be used for deployment
          example: 1
          type: integer
        EntryPoint:
          description: Path to the Stack file
          example: docker-compose.yml
          type: string
        Env:
          description: A list of environment(endpoint) variables used during stack deployment
          items:
            $ref: '#/components/schemas/portainer.Pair'
          type: array
        FromAppTemplate:
          description: Whether the stack is from a app template
          example: false
          type: boolean
        GitConfig:
          allOf:
          - $ref: '#/components/schemas/gittypes.RepoConfig'
          description: The git config of this stack
        Id:
          description: Stack Identifier
          example: 1
          type: integer
        Name:
          description: Stack name
          example: myStack
          type: string
        Namespace:
          description: Kubernetes namespace if stack is a kube application
          example: default
          type: string
        Option:
          allOf:
          - $ref: '#/components/schemas/portainer.StackOption'
          description: The stack deployment option
        ProjectPath:
          description: Path on disk to the repository hosting the Stack file
          example: /data/compose/myStack_jpofkc0i9uo9wtx1zesuk649w
          type: string
        ResourceControl:
          $ref: '#/components/schemas/portainer.ResourceControl'
        Status:
          allOf:
          - $ref: '#/components/schemas/portainer.StackStatus'
          description: Stack status (1 - active, 2 - inactive)
          example: 1
        SwarmId:
          description: Cluster identifier of the Swarm cluster where the stack is deployed
          example: jpofkc0i9uo9wtx1zesuk649w
          type: string
        Type:
          allOf:
          - $ref: '#/components/schemas/portainer.StackType'
          description: Stack type. 1 for a Swarm stack, 2 for a Compose stack
          example: 2
        UpdateDate:
          description: The date in unix time when stack was last updated
          example: 1587399600
          type: integer
        UpdatedBy:
          description: The username which last updated this stack
          example: bob
          type: string
      type: object
    stacks.kubernetesGitDeploymentPayload:
      properties:
        AdditionalFiles:
          items:
            type: string
          type: array
        AutoUpdate:
          $ref: '#/components/schemas/portainer.AutoUpdateSettings'
        ComposeFormat:
          type: boolean
        ManifestFile:
          type: string
        Namespace:
          type: string
        RepositoryAuthentication:
          type: boolean
        RepositoryPassword:
          type: string
        RepositoryReferenceName:
          type: string
        RepositoryURL:
          type: string
        RepositoryUsername:
          type: string
        StackName:
          type: string
        TLSSkipVerify:
          description: TLSSkipVerify skips SSL verification when cloning the Git repository
          example: false
          type: boolean
      type: object
    stacks.composeStackFromGitRepositoryPayload:
      properties:
