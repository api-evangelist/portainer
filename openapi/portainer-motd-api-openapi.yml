openapi: 3.2.0
info:
  contact:
    email: info@portainer.io
  description: Portainer API is an HTTP API served by Portainer.
  license:
    name: zlib
    url: https://github.com/portainer/portainer/blob/develop/LICENSE
  title: PortainerCE Motd API
  version: 2.39.1
servers:
- url: /api
tags:
- description: Fetch the message of the day
  name: motd
paths:
  /motd:
    get:
      description: '**Access policy**: restricted'
      operationId: MOTD
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/motd.motdResponse'
      security:
      - ApiKeyAuth: []
      - jwt: []
      summary: fetches the message of the day
      tags:
      - motd
components:
  schemas:
    motd.motdResponse:
      properties:
        ContentLayout:
          additionalProperties:
            type: string
          type: object
        Hash:
          items:
            type: integer
          type: array
        Message:
          type: string
        Style:
          type: string
        Title:
          type: string
      type: object
  securitySchemes:
    ApiKeyAuth:
      in: header
      name: X-API-KEY
      type: apiKey
    jwt:
      in: header
      name: Authorization
      type: apiKey
