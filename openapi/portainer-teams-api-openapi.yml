openapi: 3.2.0
info:
  contact:
    email: info@portainer.io
  description: Portainer API is an HTTP API served by Portainer.
  license:
    name: zlib
    url: https://github.com/portainer/portainer/blob/develop/LICENSE
  title: PortainerCE Teams API
  version: 2.39.1
servers:
- url: /api
tags:
- description: Manage teams
  name: Teams
paths:
  /teams:
    get:
      description: 'List teams. For non-administrator users, will only list the teams they are member of.

        **Access policy**: restricted'
      operationId: TeamList
      parameters:
      - description: Only list teams that the user is leader of
        in: query
        name: onlyLedTeams
        schema:
          type: boolean
      - description: Identifier of the environment(endpoint) that will be used to filter the authorized teams
        in: query
        name: environmentId
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/portainer.Team'
                type: array
        '500':
          description: Server error
      security:
      - ApiKeyAuth: []
      - jwt: []
      summary: List teams
      tags:
      - Teams
    post:
      description: 'Create a new team.

        **Access policy**: administrator'
      operationId: TeamCreate
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/portainer.Team'
        '400':
          description: Invalid request
        '409':
          description: A team with the same name already exists
        '500':
          description: Server error
      security:
      - ApiKeyAuth: []
      - jwt: []
      summary: Create a new team
      tags:
      - Teams
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/teams.teamCreatePayload'
        description: details
        required: true
  /teams/{id}:
    delete:
      description: 'Remove a team.

        **Access policy**: administrator'
      operationId: TeamDelete
      parameters:
      - description: Team Id
        in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: Success
        '400':
          description: Invalid request
        '403':
          description: Permission denied
        '404':
          description: Team not found
        '500':
          description: Server error
      security:
      - ApiKeyAuth: []
      - jwt: []
      summary: Remove a team
      tags:
      - Teams
    get:
      description: 'Retrieve details about a team. Access is only available for administrator and leaders of that team.

        **Access policy**: administrator'
      operationId: TeamInspect
      parameters:
      - description: Team identifier
        in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/portainer.Team'
        '400':
          description: Invalid request
        '403':
          description: Permission denied
        '404':
          description: Team not found
        '500':
          description: Server error
      security:
      - ApiKeyAuth: []
      - jwt: []
      summary: Inspect a team
      tags:
      - Teams
    put:
      description: 'Update a team.

        **Access policy**: administrator'
      operationId: TeamUpdate
      parameters:
      - description: Team identifier
        in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/portainer.Team'
        '400':
          description: Invalid request
        '403':
          description: Permission denied
        '404':
          description: Team not found
        '500':
          description: Server error
      security:
      - ApiKeyAuth: []
      - jwt: []
      summary: Update a team
      tags:
      - Teams
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/teams.teamUpdatePayload'
        description: Team details
        required: true
components:
  schemas:
    portainer.Team:
      properties:
        Id:
          description: Team Identifier
          example: 1
          type: integer
        Name:
          description: Team name
          example: developers
          type: string
      type: object
    teams.teamCreatePayload:
      properties:
        Name:
          description: Name
          example: developers
          type: string
        TeamLeaders:
          description: TeamLeaders
          example:
          - 3
          - 5
          items:
            type: integer
          type: array
      required:
      - Name
      type: object
    teams.teamUpdatePayload:
      properties:
        Name:
          description: Name
          example: developers
          type: string
      type: object
  securitySchemes:
    ApiKeyAuth:
      in: header
      name: X-API-KEY
      type: apiKey
    jwt:
      in: header
      name: Authorization
      type: apiKey
