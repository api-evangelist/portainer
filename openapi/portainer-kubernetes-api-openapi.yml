        jwt: []
      summary: Get a list of services
      tags:
      - kubernetes
  /kubernetes/{id}/services/count:
    get:
      description: 'Get the count of services that the user has access to.

        **Access policy**: Authenticated user.'
      operationId: GetAllKubernetesServicesCount
      parameters:
      - description: Environment identifier
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        '200':
          description: Success
          schema:
            type: integer
        '400':
          description: Invalid request payload, such as missing required fields or fields not meeting validation criteria.
        '401':
          description: Unauthorized access - the user is not authenticated or does not have the necessary permissions. Ensure that you have provided a valid API key or JWT token, and that you have the required permissions.
        '403':
          description: Permission denied - the user is authenticated but does not have the necessary permissions to access the requested resource or perform the specified operation. Check your user roles and permissions.
        '404':
          description: Unable to find an environment with the specified identifier.
        '500':
          description: Server error occurred while attempting to retrieve the total count of all services.
      security:
      - ApiKeyAuth: []
        jwt: []
      summary: Get services count
      tags:
      - kubernetes
  /kubernetes/{id}/services/delete:
    post:
      consumes:
      - application/json
      description: 'Delete the provided list of services.

        **Access policy**: Authenticated user.'
      operationId: DeleteKubernetesServices
      parameters:
      - description: Environment identifier
        in: path
        name: id
        required: true
        type: integer
      - description: A map where the key is the namespace and the value is an array of services to delete
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/kubernetes.K8sServiceDeleteRequests'
      produces:
      - application/json
      responses:
        '204':
          description: Success
        '400':
          description: Invalid request payload, such as missing required fields or fields not meeting validation criteria.
        '401':
          description: Unauthorized access - the user is not authenticated or does not have the necessary permissions. Ensure that you have provided a valid API key or JWT token, and that you have the required permissions.
        '403':
          description: Permission denied - the user is authenticated but does not have the necessary permissions to access the requested resource or perform the specified operation. Check your user roles and permissions.
        '404':
          description: Unable to find an environment with the specified identifier or unable to find a specific service.
        '500':
          description: Server error occurred while attempting to delete services.
      security:
      - ApiKeyAuth: []
        jwt: []
      summary: Delete services
      tags:
      - kubernetes
  /kubernetes/{id}/volumes:
    get:
      description: 'Get a list of all kubernetes volumes within the given environment (Endpoint). The Endpoint ID must be a valid Portainer environment identifier.

        **Access policy**: Authenticated user.'
      operationId: GetAllKubernetesVolumes
      parameters:
      - description: Environment identifier
        in: path
        name: id
        required: true
        type: integer
      - description: When set to True, include the applications that are using the volumes. It is set to false by default
        in: query
        name: withApplications
        type: boolean
      produces:
      - application/json
      responses:
        '200':
          description: Success
          schema:
            additionalProperties:
              $ref: '#/definitions/kubernetes.K8sVolumeInfo'
            type: object
        '400':
          description: Invalid request payload, such as missing required fields or fields not meeting validation criteria.
        '403':
          description: Unauthorized access or operation not allowed.
        '500':
          description: Server error occurred while attempting to retrieve kubernetes volumes.
      security:
      - ApiKeyAuth: []
        jwt: []
      summary: Get Kubernetes volumes within the given Portainer environment
      tags:
      - kubernetes
  /kubernetes/{id}/volumes/{namespace}/{volume}:
    get:
      description: 'Get a Kubernetes volume within the given environment (Endpoint). The Endpoint ID must be a valid Portainer environment identifier.

        **Access policy**: Authenticated user.'
      operationId: GetKubernetesVolume
      parameters:
      - description: Environment identifier
        in: path
        name: id
        required: true
        type: integer
      - description: Namespace identifier
        in: path
        name: namespace
        required: true
        type: string
      - description: Volume name
        in: path
        name: volume
        required: true
        type: string
      produces:
      - application/json
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/kubernetes.K8sVolumeInfo'
        '400':
          description: Invalid request
        '500':
          description: Server error
      security:
      - ApiKeyAuth: []
        jwt: []
      summary: Get a Kubernetes volume within the given Portainer environment
      tags:
      - kubernetes
  /kubernetes/{id}/volumes/count:
    get:
      description: 'Get the total number of kubernetes volumes within the given environment (Endpoint). The total count depends on the user''s role and permissions. The Endpoint ID must be a valid Portainer environment identifier.

        **Access policy**: Authenticated user.'
      operationId: getAllKubernetesVolumesCount
      parameters:
      - description: Environment identifier
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        '200':
          description: Success
          schema:
            type: integer
        '400':
          description: Invalid request payload, such as missing required fields or fields not meeting validation criteria.
        '403':
          description: Unauthorized access or operation not allowed.
        '500':
          description: Server error occurred while attempting to retrieve kubernetes volumes count.
      security:
      - ApiKeyAuth: []
        jwt: []
      summary: Get the total number of kubernetes volumes within the given Portainer environment.
      tags:
      - kubernetes
  /kubernetes/config:
    get:
      description: 'Generate a kubeconfig file that allows a client to communicate with the Kubernetes API server

        **Access policy**: Authenticated user.'
      operationId: GetKubernetesConfig
      parameters:
      - collectionFormat: csv
        description: will include only these environments(endpoints)
        in: query
        items:
          type: integer
        name: ids
        type: array
      - collectionFormat: csv
        description: will exclude these environments(endpoints)
        in: query
        items:
          type: integer
        name: excludeIds
        type: array
      produces:
      - application/json
      - ' application/yaml'
      responses:
        '200':
          description: Success
          schema:
            type: object
        '400':
          description: Invalid request payload, such as missing required fields or fields not meeting validation criteria.
        '401':
          description: Unauthorized access - the user is not authenticated or does not have the necessary permissions. Ensure that you have provided a valid API key or JWT token, and that you have the required permissions.
        '403':
          description: Permission denied - the user is authenticated but does not have the necessary permissions to access the requested resource or perform the specified operation. Check your user roles and permissions.
        '404':
          description: Unable to find an environment with the specified identifier.
        '500':
          description: Server error occurred while attempting to generate the kubeconfig file.
      security:
      - ApiKeyAuth: []
        jwt: []
      summary: Generate a kubeconfig file
      tags:
      - kubernetes
definitions:
  v1.ConfigMapKeySelector:
    properties:
      key:
        description: The key to select.
        type: string
      name:
        description: 'Name of the referent.

          This field is effectively required, but due to backwards compatibility is

          allowed to be empty. Instances of this type with an empty value here are

          almost certainly wrong.

          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names

          +optional

          +default=""

          +kubebuilder:default=""

          TODO: Drop `kubebuilder:default` when controller-gen doesn''t need it https://github.com/kubernetes-sigs/kubebuilder/issues/3896.'
        type: string
      optional:
        description: 'Specify whether the ConfigMap or its key must be defined

          +optional'
        type: boolean
    type: object
  v1.VolumeMount:
    properties:
      mountPath:
        description: 'Path within the container at which the volume should be mounted.  Must

          not contain '':''.'
        type: string
      mountPropagation:
        allOf:
        - $ref: '#/definitions/v1.MountPropagationMode'
        description: 'mountPropagation determines how mounts are propagated from the host

          to container and the other way around.

          When not set, MountPropagationNone is used.

          This field is beta in 1.10.

          When RecursiveReadOnly is set to IfPossible or to Enabled, MountPropagation must be None or unspecified

          (which defaults to None).

          +optional'
      name:
        description: This must match the Name of a Volume.
        type: string
      readOnly:
        description: 'Mounted read-only if true, read-write otherwise (false or unspecified).

          Defaults to false.

          +optional'
        type: boolean
      recursiveReadOnly:
        allOf:
        - $ref: '#/definitions/v1.RecursiveReadOnlyMode'
        description: 'RecursiveReadOnly specifies whether read-only mounts should be handled

          recursively.


          If ReadOnly is false, this field has no meaning and must be unspecified.


          If ReadOnly is true, and this field is set to Disabled, the mount is not made

          recursively read-only.  If this field is set to IfPossible, the mount is made

          recursively read-only, if it is supported by the container runtime.  If this

          field is set to Enabled, the mount is made recursively read-only if it is

          supported by the container runtime, otherwise the pod will not be started and

          an error will be generated to indicate the reason.


          If this field is set to IfPossible or Enabled, MountPropagation must be set to

          None (or be unspecified, which defaults to None).


          If this field is not specified, it is treated as an equivalent of Disabled.

          +optional'
      subPath:
        description: 'Path within the volume from which the container''s volume should be mounted.

          Defaults to "" (volume''s root).

          +optional'
        type: string
      subPathExpr:
        description: 'Expanded path within the volume from which the container''s volume should be mounted.

          Behaves similarly to SubPath but environment variable references $(VAR_NAME) are expanded using the container''s environment.

          Defaults to "" (volume''s root).

          SubPathExpr and SubPath are mutually exclusive.

          +optional'
        type: string
    type: object
  v1.WindowsSecurityContextOptions:
    properties:
      gmsaCredentialSpec:
        description: 'GMSACredentialSpec is where the GMSA admission webhook

          (https://github.com/kubernetes-sigs/windows-gmsa) inlines the contents of the

          GMSA credential spec named by the GMSACredentialSpecName field.

          +optional'
        type: string
      gmsaCredentialSpecName:
        description: 'GMSACredentialSpecName is the name of the GMSA credential spec to use.

          +optional'
        type: string
      hostProcess:
        description: 'HostProcess determines if a container should be run as a ''Host Process'' container.

          All of a Pod''s containers must have the same effective HostProcess value

          (it is not allowed to have a mix of HostProcess containers and non-HostProcess containers).

          In addition, if HostProcess is true then HostNetwork must also be set to true.

          +optional'
        type: boolean
      runAsUserName:
        description: 'The UserName in Windows to run the entrypoint of the container process.

          Defaults to the user specified in image metadata if unspecified.

          May also be set in PodSecurityContext. If set in both SecurityContext and

          PodSecurityContext, the value specified in SecurityContext takes precedence.

          +optional'
        type: string
    type: object
  v1.ContainerRestartRuleOnExitCodes:
    properties:
      operator:
        allOf:
        - $ref: '#/definitions/v1.ContainerRestartRuleOnExitCodesOperator'
        description: "Represents the relationship between the container exit code(s) and the\nspecified values. Possible values are:\n- In: the requirement is satisfied if the container exit code is in the\n  set of specified values.\n- NotIn: the requirement is satisfied if the container exit code is\n  not in the set of specified values.\n+required"
      values:
        description: 'Specifies the set of values to check for container exit codes.

          At most 255 elements are allowed.

          +optional

          +listType=set'
        items:
          type: integer
        type: array
    type: object
  v1.TCPSocketAction:
    properties:
      host:
        description: 'Optional: Host name to connect to, defaults to the pod IP.

          +optional'
        type: string
      port:
        allOf:
        - $ref: '#/definitions/intstr.IntOrString'
        description: 'Number or name of the port to access on the container.

          Number must be in the range 1 to 65535.

          Name must be an IANA_SVC_NAME.'
    type: object
  kubernetes.K8sPersistentVolumeClaim:
    properties:
      accessModes:
        items:
          $ref: '#/definitions/v1.PersistentVolumeAccessMode'
        type: array
      creationDate:
        type: string
      id:
        type: string
      labels:
        additionalProperties:
          type: string
        type: object
      name:
        type: string
      namespace:
        type: string
      owningApplications:
        items:
          $ref: '#/definitions/kubernetes.K8sApplication'
        type: array
      phase:
        $ref: '#/definitions/v1.PersistentVolumeClaimPhase'
      resourcesRequests:
        $ref: '#/definitions/v1.ResourceList'
      storage:
        type: integer
      storageClass:
        type: string
      volumeMode:
        $ref: '#/definitions/v1.PersistentVolumeMode'
      volumeName:
        type: string
    type: object
  v1.SleepAction:
    properties:
      seconds:
        description: Seconds is the number of seconds to sleep.
        type: integer
    type: object
  v1.PersistentVolumeAccessMode:
    enum:
    - ReadWriteOnce
    - ReadOnlyMany
    - ReadWriteMany
    - ReadWriteOncePod
    type: string
    x-enum-varnames:
    - ReadWriteOnce
    - ReadOnlyMany
    - ReadWriteMany
    - ReadWriteOncePod
  kubernetes.K8sSecret:
    properties:
      Annotations:
        additionalProperties:
          type: string
        type: object
      ConfigurationOwner:
        type: string
      ConfigurationOwnerId:
        type: string
      ConfigurationOwners:
        items:
          $ref: '#/definitions/kubernetes.K8sConfigurationOwnerResource'
        type: array
      CreationDate:
        type: string
      Data:
        additionalProperties:
          type: string
        type: object
      IsUsed:
        type: boolean
      Labels:
        additionalProperties:
          type: string
        type: object
      Name:
        type: string
      Namespace:
        type: string
      SecretType:
        type: string
      UID:
        type: string
    type: object
  v1.CSIPersistentVolumeSource:
    properties:
      controllerExpandSecretRef:
        allOf:
        - $ref: '#/definitions/v1.SecretReference'
        description: 'controllerExpandSecretRef is a reference to the secret object containing

          sensitive information to pass to the CSI driver to complete the CSI

          ControllerExpandVolume call.

          This field is optional, and may be empty if no secret is required. If the

          secret object contains more than one secret, all secrets are passed.

          +optional'
      controllerPublishSecretRef:
        allOf:
        - $ref: '#/definitions/v1.SecretReference'
        description: 'controllerPublishSecretRef is a reference to the secret object containing

          sensitive information to pass to the CSI driver to complete the CSI

          ControllerPublishVolume and ControllerUnpublishVolume calls.

          This field is optional, and may be empty if no secret is required. If the

          secret object contains more than one secret, all secrets are passed.

          +optional'
      driver:
        description: 'driver is the name of the driver to use for this volume.

          Required.'
        type: string
      fsType:
        description: 'fsType to mount. Must be a filesystem type supported by the host operating system.

          Ex. "ext4", "xfs", "ntfs".

          +optional'
        type: string
      nodeExpandSecretRef:
        allOf:
        - $ref: '#/definitions/v1.SecretReference'
        description: 'nodeExpandSecretRef is a reference to the secret object containing

          sensitive information to pass to the CSI driver to complete the CSI

          NodeExpandVolume call.

          This field is optional, may be omitted if no secret is required. If the

          secret object contains more than one secret, all secrets are passed.

          +optional'
      nodePublishSecretRef:
        allOf:
        - $ref: '#/definitions/v1.SecretReference'
        description: 'nodePublishSecretRef is a reference to the secret object containing

          sensitive information to pass to the CSI driver to complete the CSI

          NodePublishVolume and NodeUnpublishVolume calls.

          This field is optional, and may be empty if no secret is required. If the

          secret object contains more than one secret, all secrets are passed.

          +optional'
      nodeStageSecretRef:
        allOf:
        - $ref: '#/definitions/v1.SecretReference'
        description: 'nodeStageSecretRef is a reference to the secret object containing sensitive

          information to pass to the CSI driver to complete the CSI NodeStageVolume

          and NodeStageVolume and NodeUnstageVolume calls.

          This field is optional, and may be empty if no secret is required. If the

          secret object contains more than one secret, all secrets are passed.

          +optional'
      readOnly:
        description: 'readOnly value to pass to ControllerPublishVolumeRequest.

          Defaults to false (read/write).

          +optional'
        type: boolean
      volumeAttributes:
        additionalProperties:
          type: string
        description: 'volumeAttributes of the volume to publish.

          +optional'
        type: object
      volumeHandle:
        description: 'volumeHandle is the unique volume name returned by the CSI volume

          plugin’s CreateVolume to refer to the volume on all subsequent calls.

          Required.'
        type: string
    type: object
  kubernetes.K8sRole:
    properties:
      creationDate:
        type: string
      isSystem:
        description: 'isSystem is true if prefixed with "system:" or exists in the kube-system namespace

          or is one of the portainer roles'
        type: boolean
      name:
        type: string
      namespace:
        type: string
      uid:
        type: string
    type: object
  v1.NamespaceStatus:
    properties:
      conditions:
        description: 'Represents the latest available observations of a namespace''s current state.

          +optional

          +patchMergeKey=type

          +patchStrategy=merge

          +listType=map

          +listMapKey=type'
        items:
          $ref: '#/definitions/v1.NamespaceCondition'
        type: array
      phase:
        allOf:
        - $ref: '#/definitions/v1.NamespacePhase'
        description: 'Phase is the current lifecycle phase of the namespace.

          More info: https://kubernetes.io/docs/tasks/administer-cluster/namespaces/

          +optional'
    type: object
  v1beta1.NodeMetrics:
    properties:
      apiVersion:
        description: 'APIVersion defines the versioned schema of this representation of an object.

          Servers should convert recognized schemas to the latest internal value, and

          may reject unrecognized values.

          More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources

          +optional'
        type: string
      kind:
        description: 'Kind is a string value representing the REST resource this object represents.

          Servers may infer this from the endpoint the client submits requests to.

          Cannot be updated.

          In CamelCase.

          More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds

          +optional'
        type: string
      metadata:
        allOf:
        - $ref: '#/definitions/v1.ObjectMeta'
        description: 'Standard object''s metadata.

          More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#metadata

          +optional'
      timestamp:
        description: 'The following fields define time interval from which metrics were

          collected from the interval [Timestamp-Window, Timestamp].'
        type: string
      usage:
        allOf:
        - $ref: '#/definitions/v1.ResourceList'
        description: The memory usage is the memory working set.
      window:
        $ref: '#/definitions/v1.Duration'
    type: object
  kubernetes.K8sServicePort:
    properties:
      Name:
        type: string
      NodePort:
        type: integer
      Port:
        type: integer
      Protocol:
        type: string
      TargetPort:
        type: string
    type: object
  v1.ScopedResourceSelectorRequirement:
    properties:
      operator:
        allOf:
        - $ref: '#/definitions/v1.ScopeSelectorOperator'
        description: 'Represents a scope''s relationship to a set of values.

          Valid operators are In, NotIn, Exists, DoesNotExist.'
      scopeName:
        allOf:
        - $ref: '#/definitions/v1.ResourceQuotaScope'
        description: The name of the scope that the selector applies to.
      values:
        description: 'An array of string values. If the operator is In or NotIn,

          the values array must be non-empty. If the operator is Exists or DoesNotExist,

          the values array must be empty.

          This array is replaced during a strategic merge patch.

          +optional

          +listType=atomic'
        items:
          type: string
        type: array
    type: object
  v1.ResourceFieldSelector:
    properties:
      containerName:
        description: 'Container name: required for volumes, optional for env vars

          +optional'
        type: string
      divisor:
        allOf:
        - $ref: '#/definitions/resource.Quantity'
        description: 'Specifies the output format of the exposed resources, defaults to "1"

          +optional'
      resource:
        description: 'Required: resource to select'
        type: string
    type: object
  v1.Container:
    properties:
      args:
        description: 'Arguments to the entrypoint.

          The container image''s CMD is used if this is not provided.

          Variable references $(VAR_NAME) are expanded using the container''s environment. If a variable

          cannot be resolved, the reference in the input string will be unchanged. Double $$ are reduced

          to a single $, which allows for escaping the $(VAR_NAME) syntax: i.e. "$$(VAR_NAME)" will

          produce the string literal "$(VAR_NAME)". Escaped references will never be expanded, regardless

          of whether the variable exists or not. Cannot be updated.

          More info: https://kubernetes.io/docs/tasks/inject-data-application/define-command-argument-container/#running-a-command-in-a-shell

          +optional

          +listType=atomic'
        items:
          type: string
        type: array
      command:
        description: 'Entrypoint array. Not executed within a shell.

          The container image''s ENTRYPOINT is used if this is not provided.

          Variable references $(VAR_NAME) are expanded using the container''s environment. If a variable

          cannot be resolved, the reference in the input string will be unchanged. Double $$ are reduced

          to a single $, which allows for escaping the $(VAR_NAME) syntax: i.e. "$$(VAR_NAME)" will

          produce the string literal "$(VAR_NAME)". Escaped references will never be expanded, regardless

          of whether the variable exists or not. Cannot be updated.

          More info: https://kubernetes.io/docs/tasks/inject-data-application/define-command-argument-container/#running-a-command-in-a-shell

          +optional

          +listType=atomic'
        items:
          type: string
        type: array
      env:
        description: 'List of environment variables to set in the container.

          Cannot be updated.

          +optional

          +patchMergeKey=name

          +patchStrategy=merge

          +listType=map

          +listMapKey=name'
        items:
          $ref: '#/definitions/v1.EnvVar'
        type: array
      envFrom:
        description: 'List of sources to populate environment variables in the container.

          The keys defined within a source may consist of any printable ASCII characters except ''=''.

          When a key exists in multiple

          sources, the value associated with the last source will take precedence.

          Values defined by an Env with a duplicate key will take precedence.

          Cannot be updated.

          +optional

          +listType=atomic'
        items:
          $ref: '#/definitions/v1.EnvFromSource'
        type: array
      image:
        description: 'Container image name.

          More info: https://kubernetes.io/docs/concepts/containers/images

          This field is optional to allow higher level config management to default or override

          container images in workload controllers like Deployments and StatefulSets.

          +optional'
        type: string
      imagePullPolicy:
        allOf:
        - $ref: '#/definitions/v1.PullPolicy'
        description: 'Image pull policy.

          One of Always, Never, IfNotPresent.

          Defaults to Always if :latest tag is specified, or IfNotPresent otherwise.

          Cannot be updated.

          More info: https://kubernetes.io/docs/concepts/containers/images#updating-images

          +optional'
      lifecycle:
        allOf:
        - $ref: '#/definitions/v1.Lifecycle'
        description: 'Actions that the management system should take in response to container lifecycle events.

          Cannot be updated.

          +optional'
      livenessProbe:
        allOf:
        - $ref: '#/definitions/v1.Probe'
        description: 'Periodic probe of container liveness.

          Container will be restarted if the probe fails.

          Cannot be updated.

          More info: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle#container-probes

          +optional'
      name:
        description: 'Name of the container specified as a DNS_LABEL.

          Each container in a pod must have a unique name (DNS_LABEL).

          Cannot be updated.'
        type: string
      ports:
        description: 'List of ports to expose from the container. Not specifying a port here

          DOES NOT prevent that port from being exposed. Any port which is

          listening on the default "0.0.0.0" address inside a container will be

          accessible from the network.

          Modifying this array with strategic merge patch may corrupt the data.

          For more information See https://github.com/kubernetes/kubernetes/issues/108255.

          Cannot be updated.

          +optional

          +patchMergeKey=containerPort

          +patchStrategy=merge

          +listType=map

          +listMapKey=containerPort

          +listMapKey=protocol'
        items:
          $ref: '#/definitions/v1.ContainerPort'
        type: array
      readinessProbe:
        allOf:
        - $ref: '#/definitions/v1.Probe'
        description: 'Periodic probe of container service readiness.

          Container will be removed from service endpoints if the probe fails.

          Cannot be updated.

          More info: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle#container-probes

          +optional'
      resizePolicy:
        description: 'Resources resize policy for the container.

          This field cannot be set on ephemeral containers.

          +featureGate=InPlacePodVerticalScaling

          +optional

          +listType=atomic'
        items:
          $ref: '#/definitions/v1.ContainerResizePolicy'
        type: array
      resources:
        allOf:
        - $ref: '#/definitions/v1.ResourceRequirements'
        description: 'Compute Resources required by this container.

          Cannot be updated.

          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/

          +optional'
      restartPolicy:
        allOf:
        - $ref: '#/definitions/v1.ContainerRestartPolicy'
        description: 'RestartPolicy defines the restart behavior of individual containers in a pod.

          This overrides the pod-level restart policy. When this field is not specified,

          the restart behavior is defined by the Pod''s restart policy and the container type.

          Additionally, setting the RestartPolicy as "Always" for the init container will

          have the following effect:

