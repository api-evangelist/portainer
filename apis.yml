aid: portainer
name: Portainer
description: Portainer provides a centralized multi‑cluster management platform for Kubernetes, Docker, Swarm and Podman workloads. It offers
  enterprise identity and access features such as SSO, LDAP and OIDC, as well as GitOps deployment workflows and self‑service guardrails. The
  product is aimed at engineering teams and enterprises that need to govern containerized applications across on‑premises, cloud and edge environments
  from a single console.
