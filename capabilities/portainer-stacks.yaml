          in: path
          type: integer
          description: Stack identifier
          required: true
        - name: endpointId
          in: query
          type: integer
          description: Environment identifier
          required: true
        - name: body
          in: body
          type: string
          description: Stack details
          required: true
    - name: stacks-id-associate
