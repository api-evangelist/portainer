naftiko: 1.0.0-alpha2
info:
  label: PortainerCE API — ssl
  description: 'PortainerCE API — ssl. 2 operations. Lead operation: Inspect the ssl settings. Self-contained Naftiko capability
    covering one Portainer business surface.'
  tags:
  - Portainer
  - ssl
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PORTAINER_API_KEY: PORTAINER_API_KEY
capability:
  consumes:
  - type: http
    namespace: portainer-ssl
    baseUri: ''
    description: PortainerCE API — ssl business capability. Self-contained, no shared references.
    resources:
    - name: ssl
      path: /ssl
      operations:
      - name: sslinspect
        method: GET
        description: Inspect the ssl settings
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: sslupdate
        method: PUT
        description: Update the ssl settings
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: string
          description: SSL Settings
          required: true
  exposes:
  - type: rest
    namespace: portainer-ssl-rest
    port: 8080
    description: REST adapter for PortainerCE API — ssl. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/ssl
      name: ssl
      description: REST surface for ssl.
      operations:
      - method: GET
        name: sslinspect
        description: Inspect the ssl settings
        call: portainer-ssl.sslinspect
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: sslupdate
        description: Update the ssl settings
        call: portainer-ssl.sslupdate
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: portainer-ssl-mcp
    port: 9090
    transport: http
    description: MCP adapter for PortainerCE API — ssl. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: inspect-ssl-settings
      description: Inspect the ssl settings
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: portainer-ssl.sslinspect
      outputParameters:
      - type: object
        mapping: $.
    - name: update-ssl-settings
      description: Update the ssl settings
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: portainer-ssl.sslupdate
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
